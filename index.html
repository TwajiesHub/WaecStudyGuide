const theory2024 = [

  // ── Q1 ──────────────────────────────────
  {id:"24_Q1a",section:"Q1 — Internet & Maintenance",badge:"Q1(a)",
   question:"State <strong>four benefits of the Internet in Education</strong>",marks:"4 marks",
   keypoints:["Must state FOUR distinct benefits","Each benefit = 1 mark","Benefits must specifically relate to EDUCATION, not general internet use","Common accepted answers: collaboration, research, e-learning, communication, virtual lab, personalised learning"],
   modelAnswer:"1. It provides opportunities for collaboration between teachers, students and schools.\n2. It is employed for carrying out research.\n3. It supports virtual laboratory / virtual learning environments.\n4. It is used for communication between teachers and students.\n\nOther accepted benefits:\n• It provides opportunity for continuous/distance education\n• It supports personalised learning for students\n• It provides access to a wide range of educational resources online\n• It enables real-time feedback and online assessments",
   examinerTip:"Four distinct points, four marks. Write each as a clear sentence. The examiner ticks each point separately — layout as a numbered list.",
   commonMistake:"Writing general internet benefits like 'you can shop online' — these are NOT educational benefits. Stay focused on learning and teaching."},

  {id:"24_Q1b",section:"Q1 — Internet & Maintenance",badge:"Q1(b)",
   question:"Explain the following types of maintenance in computing: (i) corrective &nbsp; (ii) adaptive &nbsp; (iii) preventive",marks:"6 marks",
   keypoints:["2 marks per type","Each type needs a clear definition","Use key distinguishing words: FAULT (corrective), ENVIRONMENT (adaptive), AVOID BREAKDOWN (preventive)","Examples help but are not compulsory"],
   modelAnswer:"(i) CORRECTIVE MAINTENANCE — A task performed to identify, isolate and rectify a fault so that the failed equipment or system can be restored to an operational condition.\nOR: Any maintenance performed to return equipment or a system to its proper working condition.\nExample: Replacing a faulty hard drive or fixing a software bug.\n\n(ii) ADAPTIVE MAINTENANCE — The modification of an existing system to meet/suit a new or changing environment or technological development.\nExample: Updating software to run on a new operating system like Windows 11.\n\n(iii) PREVENTIVE MAINTENANCE — A form of maintenance that is regularly performed on a system to avoid breakdown or failure.\nOR: Maintenance performed while the equipment is still working so that it does not break down unexpectedly.\nExample: Regular cleaning of computers, updating antivirus definitions.",
   examinerTip:"The examiner looks for the KEY WORD in each definition: Corrective = 'restore/rectify a fault'; Adaptive = 'new environment/changing conditions'; Preventive = 'avoid/prevent breakdown.' Miss the keyword, lose the mark.",
   commonMistake:"Confusing corrective and adaptive. Corrective = something BROKE and you fix it. Adaptive = nothing broke but the environment CHANGED (new OS, new law, new hardware)."},

  // ── Q2 ──────────────────────────────────
  {id:"24_Q2ai",section:"Q2 — File Organisation & Safety",badge:"Q2(a)(i)",
   question:"<strong>Define the term File Organisation</strong>",marks:"2 marks",
   keypoints:["Must define what file organisation IS","Key phrase: logical arrangement of data/records","Must include reference to storage and/or access/retrieval"],
   modelAnswer:"File organisation is the logical arrangement of data/records in a file.\n\nOR: File organisation refers to the systematic method and structure used to store, manage, and retrieve data in files within a computer system.\n\nOR: File organisation encompasses how files are arranged on storage devices and how the data within these files is formatted and accessed.",
   examinerTip:"'Logical arrangement of data/records in a file' is the concise WAEC-style answer. Two marks — definition + storage/access reference.",
   commonMistake:"Writing 'file organisation is the way files are organized' — this is circular and earns no marks. Explain WHAT the arrangement involves and WHY (for storage/retrieval)."},

  {id:"24_Q2aii",section:"Q2 — File Organisation & Safety",badge:"Q2(a)(ii)",
   question:"Group the following file organisation attributes under <strong>Sequential</strong> or <strong>Indexed</strong> organisation:<br>I. It does not support the use of tapes.<br>II. Records are inserted one after the other.<br>III. It does not generate random keys to identify location.<br>IV. It generates random key to identify location.",marks:"4 marks",
   keypoints:["Must match each attribute to the correct file organisation type","Sequential: II and III","Indexed: I and IV","Each correct placement = 1 mark"],
   modelAnswer:"SEQUENTIAL FILE ORGANISATION:\n• II — Records are inserted one after the other.\n• III — It does not generate random keys to identify location.\n\nINDEXED FILE ORGANISATION:\n• I — It does not support the use of tapes.\n• IV — It generates random key to identify location.\n\nMemory tip: Sequential = ordered but no random keys (like a queue — first in, first out). Indexed = uses random/index keys to jump to records directly (like a textbook index).",
   examinerTip:"Sequential = stored in order, one after another, no random access. Indexed = uses keys to jump directly to records. Match accordingly.",
   commonMistake:"Swapping II and IV — students mix up which type uses random keys. INDEXED uses random/index keys; SEQUENTIAL does not."},

  {id:"24_Q2bi",section:"Q2 — File Organisation & Safety",badge:"Q2(b)(i)",
   question:"State <strong>two safety rules</strong> observed in a computer laboratory",marks:"2 marks",
   keypoints:["Must state TWO specific, practical safety rules","Each valid rule = 1 mark","Rules must relate specifically to the computer laboratory environment"],
   modelAnswer:"1. Use surge protectors for computers to protect against power surges.\n2. Clearly identify/label emergency equipment and know the location of emergency exits.\n\nOther accepted rules:\n• Have a list of emergency contact numbers and procedures posted in the lab.\n• Do not eat or drink near computer equipment.\n• Ensure use of personal protective equipment where necessary.\n• Switch off and unplug computers before cleaning.",
   examinerTip:"Be specific — 'use surge protectors' is specific. 'Be careful with computers' is vague and earns no marks. One mark per specific rule.",
   commonMistake:"Writing 'don't break the computers' or 'handle computers with care' — too vague. Name a SPECIFIC action or precaution."},

  {id:"24_Q2bii",section:"Q2 — File Organisation & Safety",badge:"Q2(b)(ii)",
   question:"List <strong>three internet browsers</strong>",marks:"3 marks",
   keypoints:["Must name THREE distinct internet browsers","Each correct browser = 1 mark","Common examples: Chrome, Firefox, Edge, Opera, UC Browser, Safari, Brave"],
   modelAnswer:"1. Mozilla Firefox\n2. Google Chrome\n3. Microsoft Edge\n\nOther accepted browsers:\n• UC Browser\n• Opera / Opera Mini\n• Avant Browser\n• Internet Explorer\n• Vivaldi\n• Apple Safari\n• Brave Browser",
   examinerTip:"Any three valid browser names earn full marks. Go with Chrome, Firefox, Edge — easy 3 marks!",
   commonMistake:"Writing 'Google' (a search engine, not a browser) or 'Yahoo.' The BROWSER is the software (Chrome, Firefox). Google is the search engine you use inside the browser."},

  // ── Q3 ──────────────────────────────────
  {id:"24_Q3a",section:"Q3 — PowerPoint Features",badge:"Q3(a)",
   question:"Explain the use of <strong>Custom Slide Show</strong> in Microsoft PowerPoint",marks:"3 marks",
   keypoints:["Must explain what Custom Slide Show DOES","Key points: show only selected slides, tailor to different audiences, assist navigation","Each valid use/explanation = 1 mark"],
   modelAnswer:"1. Custom slide show is used to show only selected slides during a presentation (not all slides in the file).\n2. It is used to tailor/customise a presentation to different audiences — the same file can show different slide sets to different groups.\n3. It assists in navigation during a presentation — allowing the presenter to jump to specific sections.",
   examinerTip:"The key idea is SELECTION — custom slide show lets you choose WHICH slides to show. Communicate this idea of selective/customised presentation.",
   commonMistake:"Confusing Custom Slide Show with running a normal Slide Show. The 'custom' part means you choose SPECIFIC slides — without a custom show, all slides play in order."},

  {id:"24_Q3b",section:"Q3 — PowerPoint Features",badge:"Q3(b)",
   question:"State <strong>two functions of Rehearse Timings</strong> in Microsoft PowerPoint",marks:"2 marks",
   keypoints:["Must state TWO distinct functions","Key functions: records time per slide, enables automatic presentation, time management"],
   modelAnswer:"1. Rehearse Timings is used to record the time spent on each slide during practice/rehearsal.\n2. It is used to run the presentation automatically — slides advance on their own based on the recorded timings.\n\nOther accepted:\n• It ensures effective time management / ensures the presenter stays within the allocated time limit.",
   examinerTip:"Two marks, two functions. Core function = RECORDING TIME per slide. Second function = those timings make the presentation run automatically.",
   commonMistake:"Writing 'it times the presentation' without explaining WHAT the timing does. Be specific: it records time per slide so slides advance automatically."},

  {id:"24_Q3c",section:"Q3 — PowerPoint Features",badge:"Q3(c)",
   question:"List <strong>four types of illustrations</strong> that can be added to a presentation from the <em>Insert tab</em> of Microsoft PowerPoint",marks:"4 marks",
   keypoints:["Must list FOUR types from the Insert tab Illustrations group","Each valid illustration type = 1 mark","Accepted: Shapes, Icons, 3D Models, SmartArt, Chart, Pictures"],
   modelAnswer:"1. Shapes\n2. Icons\n3. 3D Models\n4. SmartArt\n\nOther accepted:\n• Chart\n• Pictures / Online Pictures",
   examinerTip:"The question says from the INSERT TAB. The Illustrations group in the Insert tab contains: Shapes, Icons, 3D Models, SmartArt, Chart, Pictures. Stick to these.",
   commonMistake:"Writing 'animation' or 'transitions' — these are NOT illustrations and NOT in the Insert tab. Illustrations = visual objects inserted into slides."},

  // ── Q4 ──────────────────────────────────
  {id:"24_Q4ai",section:"Q4 — LAN / MIS / Internet Security",badge:"Q4(a)(i)",
   question:"State <strong>two problems</strong> associated with uncontrolled access to the Internet by students",marks:"2 marks",
   keypoints:["Must state TWO distinct problems","Each valid problem = 1 mark","Problems must result from UNCONTROLLED (unsupervised/unrestricted) access"],
   modelAnswer:"1. Virus download — students may visit unsafe sites and download harmful programs/malware.\n2. Distraction from studies — students spend time on social media, games, or watching videos instead of studying.\n\nOther accepted problems:\n• Purchasing items online (misuse of school network)\n• Exposure to inappropriate/harmful content\n• Playing games to the detriment of their studies\n• Watching videos/movies / Streaming music during class time\n• Chatting on social media during classes",
   examinerTip:"The key word is 'UNCONTROLLED' — your answers must be problems that arise BECAUSE access is not restricted or supervised. Generic internet problems alone may not earn marks.",
   commonMistake:"Writing 'the internet is slow' — this is a technical issue, not a problem of uncontrolled access. Focus on BEHAVIOURAL and SECURITY problems."},

  {id:"24_Q4aii",section:"Q4 — LAN / MIS / Internet Security",badge:"Q4(a)(ii)",
   question:"How can the problems stated in Q4(a)(i) be prevented?",marks:"3 marks",
   keypoints:["Must state specific preventive measures — not just 'control internet'","Each valid, specific measure = 1 mark","Accepted: web nannies, firewalls, content filtering, supervised access, parental controls, safe search, virus detection software"],
   modelAnswer:"1. Use of web nannies / content filtering software to block access to inappropriate or harmful websites.\n2. Supervised access — a teacher, technologist or adult monitors students during internet use.\n3. Use of virus detection / antivirus software to prevent malware downloads.\n\nOther accepted measures:\n• Implementing firewalls to monitor and manage internet traffic\n• Enable safe search settings in search engines\n• Utilise parental control settings on browsers, OS and routers\n• Establish Acceptable Use Policies with penalties for misuse\n• Screen time limits and scheduled internet access windows",
   examinerTip:"Each measure must be SPECIFIC. 'Monitor students' = vague. 'Use content filtering software' = specific and earns the mark.",
   commonMistake:"Writing 'ban students from using the internet' — this defeats the educational purpose. WAEC expects controlled/managed access solutions, not complete bans."},

  {id:"24_Q4b",section:"Q4 — LAN / MIS / Internet Security",badge:"Q4(b)",
   question:"Give <strong>one reason</strong> why user authentication is required before access to the system is granted",marks:"2 marks",
   keypoints:["Must state ONE clear reason for authentication","Reason must logically explain WHY authentication is needed","Accepted: prevent unauthorized access, prevent impersonation, data safety, registered users only"],
   modelAnswer:"Authentication is required to prevent unauthorized access — ensuring that only registered and approved users can gain access to the system and its data.\n\nOther accepted reasons:\n• To prevent impersonation of authorised users\n• To ensure data integrity and safety of stored information\n• To ensure only registered users have access to the system\n• To support controlled remote and mobile access",
   examinerTip:"One reason, but explain it FULLY. 'To prevent unauthorized access' alone may earn 1 mark. Add 'ensuring only registered users access the system and its data' to secure both marks.",
   commonMistake:"Writing 'to make the system secure' without specifying what it is being secured FROM. Be specific about what authentication prevents."},

  {id:"24_Q4c",section:"Q4 — LAN / MIS / Internet Security",badge:"Q4(c)",
   question:"Table 2 shows login activities (Column X) and login steps (Column Y). Specify the correct order of steps (i)–(v) using letters A–E:<br><br><strong>A</strong>: System authenticates username and password &nbsp; <strong>B</strong>: Click on login &nbsp; <strong>C</strong>: Enter password &nbsp; <strong>D</strong>: Access granted/denied &nbsp; <strong>E</strong>: Enter username",marks:"5 marks",
   keypoints:["Must arrange all 5 steps in the correct logical login sequence","Each correct placement = 1 mark","Correct order: (i)E → (ii)C → (iii)B → (iv)A → (v)D"],
   modelAnswer:"(i)  → E: Enter username  (first — identify yourself)\n(ii) → C: Enter password  (second — prove your identity)\n(iii)→ B: Click on login  (third — submit credentials)\n(iv) → A: System authenticates  (fourth — system checks your credentials)\n(v)  → D: Access granted/denied  (fifth — result of authentication)\n\nLogic: You cannot authenticate before entering credentials. You cannot be granted/denied access before authentication checks are done.",
   examinerTip:"Think through the REAL PROCESS of logging in step by step. Username (E) → Password (C) → Submit/Login (B) → System checks (A) → Result (D). 5 real-life steps = 5 easy marks.",
   commonMistake:"Placing 'Access granted' (D) before 'System authenticates' (A) — access cannot be granted before the system has CHECKED your credentials. Check (A) MUST come before result (D)."},

  // ── Q5 (Section B) ───────────────────────
  {id:"24_Q5a",section:"Q5 — Section B: MS Access",badge:"Q5(a)",
   question:"Highlight the steps to <strong>create a new table</strong> in MS Access",marks:"4 marks",
   keypoints:["Must list correct sequential steps","Steps should start from opening/creating the database","Must include Create tab, selecting Table, defining fields and saving with a name"],
   modelAnswer:"1. Open MS Access and open or create a new database\n2. Click on Create on the ribbon/menu bar\n3. Select Table (Datasheet View) OR Table Design (Design View)\n4. In Design View: enter field names and set the data type for each field\n5. Right-click the primary key field and select 'Primary Key'\n6. Click Save (Ctrl+S) and type a name for the new table\n7. Click OK\n\nAlternative:\n1. Click File → New → Blank Desktop Database\n2. Type the database name in the File Name box and click Create\n3. A new blank table opens — define field names and data types",
   examinerTip:"The examiner expects: Create tab → Table → Define fields → Save with name. These 4 stages cover the marks.",
   commonMistake:"Confusing TABLE creation with DATABASE creation. You must first open/create a database before creating a table inside it."},

  {id:"24_Q5b",section:"Q5 — Section B: MS Access",badge:"Q5(b)",
   question:"Highlight the steps to <strong>generate a query</strong> in MS Access",marks:"4 marks",
   keypoints:["Must mention Create tab → Query Wizard","Must mention selecting the table/query that contains the data","Must include adding required fields to Selected Fields section","Must include clicking Finish/running the query"],
   modelAnswer:"1. Click on Create on the ribbon bar\n2. Click on Query Wizard\n3. Select 'Simple Query Wizard' and click OK\n4. Select the Table or Query that contains the required data\n5. Add the required fields to the 'Selected Fields' section (using the > button)\n6. Click Next\n7. Choose Detail or Summary query, then click Next\n8. Type a name for the query\n9. Click Finish to run and view the query results",
   examinerTip:"Key steps: Create → Query Wizard → Select Table → Add Fields → Finish. Each step is a mark. Don't skip 'Add Fields' — it's the most important step.",
   commonMistake:"Describing how to open Query Wizard but forgetting to mention ADDING FIELDS to the Selected Fields section. Without this, the query produces no useful output."},

  {id:"24_Q5c",section:"Q5 — Section B: MS Access",badge:"Q5(c)",
   question:"Highlight the steps to <strong>create a Split Form</strong> in MS Access",marks:"3 marks",
   keypoints:["Must select the data source first (Table or Query)","Must go to Create tab","Must select More Forms → Split Form","Split Form shows BOTH form view (top) and datasheet view (bottom) simultaneously"],
   modelAnswer:"1. Select the Table or Query that contains the data\n2. Click on the Create tab on the ribbon bar\n3. Click on 'More Forms'\n4. Click on 'Split Form'\n5. MS Access automatically generates a split form showing:\n   — Form view at the top (for viewing/entering one record at a time)\n   — Datasheet view at the bottom (for seeing all records)\n6. Save the form with an appropriate name",
   examinerTip:"A Split Form = TWO views simultaneously: form view + datasheet view. Mention this dual-view nature to show the examiner you understand what Split Form means.",
   commonMistake:"The Split Form option is inside 'More Forms' — not directly on the ribbon. Students who miss this step say 'click Split Form' without 'click More Forms' first."},

  {id:"24_Q5d",section:"Q5 — Section B: MS Access",badge:"Q5(d)",
   question:"Highlight the steps to <strong>print a report</strong> in MS Access",marks:"3 marks",
   keypoints:["Must open/select the report from the Navigation Pane first","Must go through File → Print","Must mention Print dialog and clicking OK to print"],
   modelAnswer:"1. In the Navigation Pane, locate and select the report to be printed\n2. Right-click on the report and select 'Open' (or double-click to open it)\n   Alternative: Right-click the report → click Print... to print directly\n3. Click on File in the menu bar\n4. Click on Print (or press Ctrl + P)\n5. In the Print dialog box, set printing options (printer, copies, page range)\n6. Click OK to print",
   examinerTip:"The Navigation Pane step is critical — you must OPEN the report before printing. If you skip this and go straight to File → Print, you lose marks.",
   commonMistake:"Writing 'click File → Print → select the report' — in MS Access, you cannot select a report from the Print dialog. You must OPEN it first from the Navigation Pane."},

  // ── Q6 ──────────────────────────────────
  {id:"24_Q6a",section:"Q6 — MS Word & Excel",badge:"Q6(a)",
   question:"A document created in MS Word has parts cut off when printed in portrait orientation. Highlight the steps to <strong>change orientation to Landscape</strong> and print on <strong>A4 paper</strong>",marks:"4 marks",

const theory2025 = [
  {id:"SA1ai",section:"Section A — Essay",badge:"Q1a(i)",question:"<strong>Explain the term:</strong> Data Processing",marks:"2 marks",keypoints:["Define what data processing IS — not just 'using a computer'","Mention: raw data collected → manipulated/transformed → meaningful output/information","Key contrast: 'raw facts (data)' → 'meaningful information'"],modelAnswer:"Data processing is a series of operations/actions carried out to collect, organise, manipulate, and convert raw facts (data) into meaningful information.\n\nOR: Data processing is the manipulation of raw data by a computer or other device to produce useful and meaningful information.",examinerTip:"Examiners want to see 'raw data' and 'meaningful information/output' — that contrast is the core. Don't just write 'processing data on a computer.'",commonMistake:"Writing only 'the use of a computer to process data' — too vague, earns no marks. You must show the INPUT → PROCESS → OUTPUT concept."},
  {id:"SA1aii",section:"Section A — Essay",badge:"Q1a(ii)",question:"<strong>Explain the term:</strong> Data Collation",marks:"2 marks",keypoints:["Must convey: gathering data from multiple sources","Must mention: arranging/organising into a structured/usable format","Must include the purpose: for input into the computer or further processing"],modelAnswer:"Data collation is the systematic arrangement/gathering of data collected from different sources into a structured and usable format in preparation for input into the computer.\n\nOR: It is the process of gathering and arranging data from various sources into a machine-readable form.",examinerTip:"Two key ideas must appear: (1) gathering from different sources, and (2) arranging/organising for use. Miss either and you lose marks.",commonMistake:"Confusing data collation with data collection. Collection = just gathering; collation = gathering AND systematically organising."},
  {id:"SA1b",section:"Section A — Essay",badge:"Q1b",question:"<strong>Describe the Data Processing Cycle</strong>",marks:"4 marks",keypoints:["Must name ALL stages in the correct order","Required stages: Input → Processing → Output → Storage","Feedback is optional but earns a bonus","Brief description of each stage is ideal for full marks"],modelAnswer:"The Data Processing Cycle is the sequence of stages involved in processing data from input to output and storage. It consists of:\n\n1. INPUT — Raw data is collected and entered into the computer system.\n2. PROCESSING — The data is manipulated, sorted, calculated or transformed.\n3. OUTPUT — Processed data (information) is presented to the user (e.g. on screen or printed).\n4. STORAGE — The information is saved for future use.\n(5. FEEDBACK — Output is returned to the input stage to improve the process — optional.)",examinerTip:"Always write the stages as a numbered list or clearly labelled points. Writing them in a paragraph without labels risks the examiner missing them.",commonMistake:"Forgetting STORAGE as a stage — most students write only Input, Processing, Output. The cycle is incomplete without storage."},
  {id:"SA1c",section:"Section A — Essay",badge:"Q1c",question:"State <strong>four</strong> benefits of the computer as a tool for processing data",marks:"4 marks",keypoints:["Must state FOUR clear, distinct benefits","Each benefit = 1 mark","Benefits must relate to data PROCESSING specifically","Avoid vague answers like 'it is good' or 'it is useful'"],modelAnswer:"1. High Speed — Computers process data at very high speed compared to manual methods.\n2. Accuracy — Computers produce highly accurate results, reducing human error.\n3. Large Storage Capacity — Computers can store and retrieve huge volumes of data.\n4. Consistency/Reliability — Computers handle repetitive processing tasks without fatigue.\n\nOther acceptable answers:\n• Cost-effective over time\n• Fast data retrieval\n• Ability to handle large volume of data simultaneously\n• Improved reliability of output",examinerTip:"Write them as a numbered list. Examiners mark point by point — a clear list makes it easy for them to award your marks.",commonMistake:"Writing general computer benefits (like 'it can browse the internet') instead of data PROCESSING benefits. Stay on topic."},
  {id:"SA3a",section:"Section A — Essay",badge:"Q3a",question:"Explain: (i) Simplex  (ii) Half Duplex  (iii) Full Duplex modes of information transmission with diagrams",marks:"6 marks",keypoints:["Each mode requires: a definition AND a diagram = 2 marks each","Simplex: one-way only (A→B only)","Half Duplex: both directions but NOT simultaneously","Full Duplex: both directions SIMULTANEOUSLY"],modelAnswer:"(i) SIMPLEX — One direction only. Sender transmits; receiver cannot send back.\nDiagram: [Sender] ——→ [Receiver]\n\n(ii) HALF DUPLEX — Both directions, but NOT at the same time.\nDiagram: [A] ⇄ [B] (one at a time)\n\n(iii) FULL DUPLEX — Both directions SIMULTANEOUSLY.\nDiagram: [A] ⇆ [B] (both at once)",examinerTip:"Draw diagrams with arrows. Label your diagram. 'Well-labelled' earns its own mark.",commonMistake:"Forgetting 'simultaneously' for full duplex — both half and full duplex are bidirectional; the difference is TIMING."},
  {id:"SA3b",section:"Section A — Essay",badge:"Q3b",question:"State ONE example each of Simplex, Half Duplex, and Full Duplex transmission",marks:"3 marks",keypoints:["Each correct example = 1 mark","Must match the correct mode"],modelAnswer:"Simplex: Television broadcast / Radio broadcast\nHalf Duplex: Walkie-Talkie / CB Radio\nFull Duplex: Telephone call / Mobile phone / WhatsApp/Zoom call",examinerTip:"Walkie-talkie for half duplex is the classic memorable example — one person says 'over' before the other can speak.",commonMistake:"Using 'television' for full duplex — TV broadcast is one-way (simplex) because viewers cannot transmit back to the station."},
  {id:"SA4a",section:"Section A — Essay",badge:"Q4a",question:"Differentiate between <strong>hackers</strong> and <strong>spammers</strong>",marks:"4 marks",keypoints:["Must clearly define BOTH terms","Must highlight what makes them DIFFERENT","Hacker = gains unauthorized access to systems","Spammer = sends unsolicited/bulk messages"],modelAnswer:"HACKER: A person who gains unauthorized access to a computer system or network to steal, alter, or destroy data.\n\nSPAMMER: A person who sends large volumes of unsolicited/unwanted messages (emails/texts) to many recipients.\n\nKEY DIFFERENCE: A hacker breaks INTO systems; a spammer floods communication channels with unwanted messages without necessarily gaining system access.",examinerTip:"Structure clearly: define hacker, define spammer, state key difference. Examiners award marks for each part.",commonMistake:"Saying a hacker 'destroys computers' — hackers primarily gain UNAUTHORIZED ACCESS; destruction may or may not follow."},
  {id:"SA4c",section:"Section A — Essay",badge:"Q4c",question:"Explain: (i) <em>Cookies</em>  (ii) <em>Plugin</em>  (iii) <em>Web Crawlers</em>",marks:"6 marks",keypoints:["Each term = 2 marks (definition + context/example)","Cookies: small files stored by browser to remember user info","Plugin: software component adding a feature to an existing program","Web Crawlers: bots that browse web to index pages for search engines"],modelAnswer:"(i) COOKIES — Small text files stored on a user's device by a browser when visiting a website. Used to remember user preferences and login details.\n\n(ii) PLUGIN — A software add-on that adds a specific feature to an existing application (especially browsers). Example: Adobe Flash Player.\n\n(iii) WEB CRAWLERS — Automated bots used by search engines to systematically browse the internet and index web page content. Example: Google's Googlebot.",examinerTip:"For each term: (1) what it IS, (2) what it DOES or an example. This ensures you hit both marks per term.",commonMistake:"Saying cookies are 'viruses' — cookies are generally harmless data files. Some can be misused but they are NOT malware."},
  {id:"SB5dii",section:"Section B — Practical",badge:"Q5d(ii)",question:"State TWO differences between <strong>transitions</strong> and <strong>animations</strong> in PowerPoint",marks:"4 marks",keypoints:["Transitions = effects between slides","Animations = effects on objects within a slide","Present as clear comparison"],modelAnswer:"1. Transitions are effects applied to a WHOLE SLIDE as it moves from one to the next, while Animations are effects applied to individual OBJECTS (text, images) within a slide.\n\n2. Transitions occur between slides (e.g. Fade, Push), while Animations occur on a slide without changing the slide itself (e.g. Fly In, Spin).",examinerTip:"Key contrast word: SLIDE vs OBJECT. Transitions = whole slide. Animations = objects on a slide.",commonMistake:"Describing both as 'moving effects' — they are distinct features with distinct functions."},
  {id:"SB6a",section:"Section B — Practical",badge:"Q6a",question:"Describe step-by-step how to <strong>CREATE a mail merge</strong> using a template in MS Word",marks:"5 marks",keypoints:["Steps must follow Mailings tab workflow","Must mention: opening template, connecting to data source, inserting merge fields"],modelAnswer:"1. Open MS Word and open/create the template document\n2. Click on the Mailings tab\n3. Click 'Start Mail Merge' → select document type (e.g. Letters)\n4. Click 'Select Recipients' → 'Use an Existing List'\n5. Browse and select the data file (Excel sheet or Access database)\n6. Position cursor where contact details should appear\n7. Click 'Insert Merge Field' and select appropriate fields\n8. Repeat for all required fields\n9. Click 'Preview Results' to review",examinerTip:"Key stages: Mailings tab → Start Mail Merge → Select Recipients → Insert Merge Fields. These 4 stages are the backbone.",commonMistake:"Describing how to connect to the data source but forgetting to explain how merge fields are inserted into the document."}
];

// ══════════════════════════════════════════
//  STATE
// ══════════════════════════════════════════
let objDone2024 = new Set(JSON.parse(localStorage.getItem('dp2024_obj')||'[]'));
let thDone2024  = new Set(JSON.parse(localStorage.getItem('dp2024_th') ||'[]'));
let objDone2025 = new Set(JSON.parse(localStorage.getItem('dp2025_obj')||'[]'));
let thDone2025  = new Set(JSON.parse(localStorage.getItem('dp2025_th') ||'[]'));

let currentYear = '2025';
let currentTab = 'objectives';
let currentFilter = 'all';
let searchTerm = '';

function getObjectives(){ return currentYear === '2024' ? objectives2024 : objectives2025; }
function getTheory(){ return currentYear === '2024' ? theory2024 : theory2025; }
function getObjDone(){ return currentYear === '2024' ? objDone2024 : objDone2025; }
function getThDone(){ return currentYear === '2024' ? thDone2024 : thDone2025; }

function save(){
  localStorage.setItem('dp2024_obj',JSON.stringify([...objDone2024]));
  localStorage.setItem('dp2024_th', JSON.stringify([...thDone2024]));
  localStorage.setItem('dp2025_obj',JSON.stringify([...objDone2025]));
  localStorage.setItem('dp2025_th', JSON.stringify([...thDone2025]));
}

function updateProgress(){
  const objectives = getObjectives();
  const theory = getTheory();
  const total = currentTab === 'objectives' ? objectives.length : theory.length;
  const doneSet = currentTab === 'objectives' ? getObjDone() : getThDone();
  const done = doneSet.size;
  const pct = total > 0 ? Math.round((done/total)*100) : 0;
  document.getElementById('obj-total').textContent = objectives.length;
  document.getElementById('theory-total').textContent = theory.length;
  document.getElementById('done-count').textContent = getObjDone().size + getThDone().size;
  document.getElementById('progress-fill').style.width = pct+'%';
  document.getElementById('progress-text').textContent = done+' / '+total;
  document.getElementById('tab-obj-btn').textContent = '📝 Objectives ('+objectives.length+')';
  document.getElementById('tab-th-btn').textContent = '✍️ Theory ('+theory.length+')';
}

function switchYear(yr){
  currentYear = yr;
  currentFilter = 'all';
  searchTerm = '';
  document.getElementById('search').value = '';
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.toggle('active',b.dataset.filter==='all'));
  document.querySelectorAll('.year-btn').forEach(b=>b.classList.toggle('active', b.textContent === yr));
  updateProgress();
  if(currentTab === 'objectives') renderObjectives(); else renderTheory();
}

function switchTab(tab){
  currentTab = tab;
  currentFilter = 'all';
  searchTerm = '';
  document.getElementById('search').value = '';
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.toggle('active',b.dataset.filter==='all'));
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.tab-btn')[tab==='objectives'?0:1].classList.add('active');
  document.getElementById('tab-objectives').classList.toggle('hidden', tab!=='objectives');
  document.getElementById('tab-theory').classList.toggle('hidden', tab!=='theory');
  updateProgress();
  if(tab==='objectives') renderObjectives(); else renderTheory();
}

function toggleCard(id){
  const card = document.getElementById('card-'+id);
  if(card) card.classList.toggle('open');
}

function toggleDoneObj(num){
  const done = getObjDone();
  if(done.has(num)) done.delete(num); else done.add(num);
  save(); updateProgress(); renderObjectives();
}

function toggleDoneTh(id){
  const done = getThDone();
  if(done.has(id)) done.delete(id); else done.add(id);
  save(); updateProgress(); renderTheory();
}

function renderObjectives(){
  const list = document.getElementById('obj-list');
  const objectives = getObjectives();
  const s = searchTerm;
  const filtered = objectives.filter(q=>{
    const match = !s || q.text.toLowerCase().includes(s)||q.topic.toLowerCase().includes(s)||
      (q.trap||'').toLowerCase().includes(s)||(q.hint||'').toLowerCase().includes(s)||
      (q.analogy||'').toLowerCase().includes(s)||q.answerText.toLowerCase().includes(s)||String(q.num)===s;
    const isDone = getObjDone().has(q.num);
    const filt = currentFilter==='all'||(currentFilter==='done'&&isDone)||(currentFilter==='pending'&&!isDone);
    return match&&filt;
  });
  document.getElementById('result-count').textContent =
    filtered.length!==objectives.length ? `Showing ${filtered.length} of ${objectives.length} questions` : '';
  if(!filtered.length){list.innerHTML=`<div class="empty"><h3>No questions found</h3><p>Try a different search or filter.</p></div>`;return;}

  list.innerHTML = filtered.map(q=>{
    const isDone = getObjDone().has(q.num);
    const opts = q.options
      ? q.options.map(o=>`<div style="font-size:.82rem;color:var(--muted);padding:.2rem 0;">${o}</div>`).join('')
      : '';
    return `<div class="q-card ${isDone?'done':''}" id="card-${q.num}">
      <div class="q-header" onclick="toggleCard(${q.num})">
        <div class="q-num">${q.num}</div>
        <div class="q-text">${q.text}</div>
        <div class="q-chevron">▼</div>
      </div>
      <div class="q-details">
        <div class="topic-tag">📚 ${q.topic}</div>
        ${opts ? `<div style="margin-top:.6rem;margin-bottom:.3rem;">${opts}</div>` : ''}
        <div class="detail-grid">
          <div class="detail-item d-trap"><div class="detail-label">⚠️ Trap</div>${q.trap||'Stay focused on the key concept.'}</div>
          <div class="detail-item d-hint"><div class="detail-label">💡 Hint</div>${q.hint||'Think through the definition carefully.'}</div>
          <div class="detail-item d-analogy"><div class="detail-label">🇳🇬 Nigerian Analogy</div>${q.analogy||'Apply real-life context to remember this.'}</div>
        </div>
        <div class="answer-box">
          <div class="answer-letter">${q.answerLetter}</div>
          <div class="answer-text">✅ ${q.answerText}</div>
        </div>
        <button class="done-btn" onclick="event.stopPropagation();toggleDoneObj(${q.num})">
          ${isDone?'✓ Mastered':'○ Mark as Mastered'}
        </button>
      </div>
    </div>`;
  }).join('');
}

function renderTheory(){
  const container = document.getElementById('theory-container');
  const theory = getTheory();
  const s = searchTerm;
  const filtered = theory.filter(q=>{
    const match = !s || q.question.toLowerCase().includes(s)||q.modelAnswer.toLowerCase().includes(s)||
      q.examinerTip.toLowerCase().includes(s)||q.commonMistake.toLowerCase().includes(s)||
      q.section.toLowerCase().includes(s)||q.badge.toLowerCase().includes(s);
    const isDone = getThDone().has(q.id);
    const filt = currentFilter==='all'||(currentFilter==='done'&&isDone)||(currentFilter==='pending'&&!isDone);
    return match&&filt;
  });
  document.getElementById('result-count').textContent =
    filtered.length!==theory.length ? `Showing ${filtered.length} of ${theory.length} questions` : '';
  if(!filtered.length){container.innerHTML=`<div class="questions"><div class="empty"><h3>No questions found</h3><p>Try a different search or filter.</p></div></div>`;return;}

  const sections={};
  filtered.forEach(q=>{ if(!sections[q.section]) sections[q.section]=[]; sections[q.section].push(q); });

  let html='';
  Object.keys(sections).forEach(sec=>{
    html+=`<div class="section-divider"><span>${sec}</span></div><div class="questions">`;
    sections[sec].forEach(q=>{
      const isDone=getThDone().has(q.id);
      const kpList=q.keypoints.map(k=>`<li>${k}</li>`).join('');
      html+=`<div class="t-card ${isDone?'done':''}" id="card-${q.id}">
        <div class="t-header" onclick="toggleCard('${q.id}')">
          <div class="t-badge">${q.badge}</div>
          <div class="t-question">${q.question}<span class="t-marks">${q.marks}</span></div>
          <div class="q-chevron">▼</div>
        </div>
        <div class="t-details">
          <div class="t-keypoints">
            <div class="t-section-label">📋 Key Points to Cover</div>
            <ul>${kpList}</ul>
          </div>
          <div class="t-model">
            <div class="t-section-label">✅ Model Answer</div>
            <div class="model-body">${q.modelAnswer}</div>
          </div>
          <div class="t-examiner">
            <div class="t-section-label">🎓 Examiner's Tip</div>
            ${q.examinerTip}
          </div>
          <div class="t-mistake">
            <div class="t-section-label">⚠️ Common Mistake</div>
            ${q.commonMistake}
          </div>
          <button class="done-btn" onclick="event.stopPropagation();toggleDoneTh('${q.id}')">
            ${isDone?'✓ Mastered':'○ Mark as Mastered'}
          </button>
        </div>
      </div>`;
    });
    html+=`</div>`;
  });
  container.innerHTML=html;
}

document.getElementById('search').addEventListener('input',e=>{
  searchTerm=e.target.value.toLowerCase().trim();
  if(currentTab==='objectives') renderObjectives(); else renderTheory();
});
document.querySelectorAll('.filter-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter=btn.dataset.filter;
    if(currentTab==='objectives') renderObjectives(); else renderTheory();
  });
});

// INIT — default to 2024
switchYear('2024');
</script>
