<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Data Processing — SS3 Study Guide</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --green:#008751;--green-dark:#005c36;--green-light:#00b368;--gold:#F4A900;
    --bg:#0a1a0f;--surface:#0f2318;--surface2:#152d1e;--card:#1a3828;--border:#234d35;
    --text:#e8f5ec;--muted:#7aab8a;--trap:#ff6b6b;--hint:#4ecdc4;--analogy:#f4a900;
    --answer:#00b368;--topic:#a78bfa;--examiner:#f9a8d4;--marks:#86efac;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;}

  /* HEADER */
  header{background:linear-gradient(135deg,var(--green-dark) 0%,var(--bg) 60%);border-bottom:2px solid var(--green);padding:1.4rem 1.5rem 1rem;position:sticky;top:0;z-index:100;backdrop-filter:blur(10px);}
  .header-inner{max-width:900px;margin:0 auto;}
  .brand{display:flex;align-items:center;gap:.7rem;margin-bottom:.7rem;}
  .flag{display:flex;width:32px;height:21px;border-radius:3px;overflow:hidden;flex-shrink:0;box-shadow:0 2px 6px rgba(0,0,0,.4);}
  .flag span{flex:1;}.flag .g{background:#008751;}.flag .w{background:#fff;}
  .brand-text h1{font-family:'Syne',sans-serif;font-size:clamp(1.1rem,4vw,1.55rem);font-weight:800;color:#fff;line-height:1.1;}
  .brand-text h1 span{color:var(--gold);}
  .subtitle{font-size:.72rem;color:var(--muted);margin-top:.15rem;letter-spacing:.05em;text-transform:uppercase;}
  .stats-bar{display:flex;gap:.6rem;flex-wrap:wrap;margin-bottom:.7rem;}
  .stat-pill{background:var(--surface2);border:1px solid var(--border);border-radius:50px;padding:.28rem .75rem;font-size:.72rem;color:var(--muted);display:flex;align-items:center;gap:.32rem;}
  .stat-pill strong{color:var(--text);font-weight:600;}
  .dot{width:6px;height:6px;border-radius:50%;}
  .dot-green{background:var(--green-light);}.dot-gold{background:var(--gold);}.dot-purple{background:var(--topic);}

  /* YEAR TOGGLE */
  .year-row{display:flex;align-items:center;gap:.5rem;margin-bottom:.65rem;flex-wrap:wrap;}
  .year-label{font-family:'Syne',sans-serif;font-size:.68rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);}
  .year-btn{font-family:'Syne',sans-serif;font-size:.78rem;font-weight:700;padding:.36rem .9rem;border-radius:8px;border:1.5px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;transition:all .2s;letter-spacing:.03em;}
  .year-btn.active{background:var(--gold);border-color:var(--gold);color:#000;}
  .year-btn:hover:not(.active){border-color:var(--gold);color:var(--gold);}

  .tabs{display:flex;gap:.45rem;}
  .tab-btn{font-family:'Syne',sans-serif;font-size:.8rem;font-weight:700;padding:.42rem 1rem;border-radius:8px;border:1.5px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;transition:all .2s;letter-spacing:.03em;}
  .tab-btn.active{background:var(--green);border-color:var(--green);color:#fff;}
  .tab-btn:hover:not(.active){border-color:var(--green);color:var(--green-light);}

  /* CONTROLS */
  .controls{max-width:900px;margin:1.1rem auto .45rem;padding:0 1rem;display:flex;flex-direction:column;gap:.55rem;}
  .search-box{position:relative;}
  .search-box input{width:100%;background:var(--surface);border:1.5px solid var(--border);border-radius:12px;padding:.65rem 1rem .65rem 2.5rem;color:var(--text);font-family:'DM Sans',sans-serif;font-size:.88rem;outline:none;transition:border-color .2s;}
  .search-box input:focus{border-color:var(--green);}
  .search-box input::placeholder{color:var(--muted);}
  .search-icon{position:absolute;left:.82rem;top:50%;transform:translateY(-50%);color:var(--muted);font-size:.9rem;}
  .filters{display:flex;gap:.38rem;flex-wrap:wrap;}
  .filter-btn{background:var(--surface);border:1.5px solid var(--border);border-radius:8px;padding:.32rem .75rem;color:var(--muted);font-family:'DM Sans',sans-serif;font-size:.76rem;cursor:pointer;transition:all .2s;font-weight:500;}
  .filter-btn.active,.filter-btn:hover{background:var(--green);border-color:var(--green);color:#fff;}

  /* PROGRESS */
  .progress-section{max-width:900px;margin:.65rem auto;padding:0 1rem;}
  .progress-bar-wrap{background:var(--surface);border-radius:50px;height:5px;overflow:hidden;margin-bottom:.3rem;}
  .progress-bar-fill{height:100%;background:linear-gradient(90deg,var(--green),var(--gold));border-radius:50px;transition:width .4s ease;}
  .progress-label{font-size:.7rem;color:var(--muted);}
  .progress-label span{color:var(--gold);font-weight:600;}
  .result-count{font-size:.75rem;color:var(--muted);padding:0 1rem;max-width:900px;margin:0 auto .35rem;}

  /* SHARED LIST WRAPPER */
  .questions{max-width:900px;margin:0 auto 2.5rem;padding:0 1rem;display:flex;flex-direction:column;gap:.65rem;}

  /* OBJECTIVE CARD */
  .q-card{background:var(--card);border:1.5px solid var(--border);border-radius:16px;overflow:hidden;transition:all .25s;animation:slideIn .3s ease both;}
  @keyframes slideIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
  .q-card:hover{border-color:var(--green);box-shadow:0 4px 18px rgba(0,135,81,.12);}
  .q-card.done{border-color:var(--green-light);opacity:.72;}
  .q-header{display:flex;align-items:flex-start;gap:.65rem;padding:.85rem 1.05rem;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent;}
  .q-num{background:var(--green-dark);color:var(--gold);font-family:'Syne',sans-serif;font-weight:800;font-size:.8rem;width:29px;height:29px;border-radius:7px;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px;}
  .q-card.done .q-num{background:var(--green);color:#fff;}
  .q-text{flex:1;font-size:.86rem;line-height:1.5;color:var(--text);}
  .q-text em{color:var(--gold);font-style:normal;font-weight:500;}
  .q-chevron{color:var(--muted);font-size:.95rem;flex-shrink:0;margin-top:7px;transition:transform .25s;}
  .q-card.open .q-chevron,.t-card.open .q-chevron{transform:rotate(180deg);}
  .topic-tag{display:inline-block;background:rgba(167,139,250,.1);color:var(--topic);border:1px solid rgba(167,139,250,.22);border-radius:6px;font-size:.66rem;padding:.1rem .42rem;font-weight:500;margin-bottom:.5rem;letter-spacing:.02em;}
  .q-details{display:none;padding:0 1.05rem 1.05rem;border-top:1px solid var(--border);}
  .q-card.open .q-details{display:block;}
  .detail-grid{display:flex;flex-direction:column;gap:.5rem;margin-top:.85rem;}
  .detail-item{border-radius:10px;padding:.65rem .82rem;font-size:.82rem;line-height:1.55;}
  .detail-label{font-family:'Syne',sans-serif;font-size:.63rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:.22rem;}
  .d-trap{background:rgba(255,107,107,.07);border:1px solid rgba(255,107,107,.17);}
  .d-trap .detail-label{color:var(--trap);}
  .d-hint{background:rgba(78,205,196,.07);border:1px solid rgba(78,205,196,.17);}
  .d-hint .detail-label{color:var(--hint);}
  .d-analogy{background:rgba(244,169,0,.07);border:1px solid rgba(244,169,0,.17);}
  .d-analogy .detail-label{color:var(--analogy);}
  .answer-box{background:rgba(0,179,104,.1);border:1.5px solid rgba(0,179,104,.28);border-radius:10px;padding:.65rem .82rem;display:flex;align-items:center;gap:.65rem;margin-top:.38rem;}
  .answer-letter{background:var(--green);color:#fff;font-family:'Syne',sans-serif;font-weight:800;font-size:1rem;width:32px;height:32px;border-radius:7px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .answer-text{font-size:.84rem;color:var(--answer);font-weight:500;line-height:1.4;}
  .done-btn{margin-top:.85rem;background:transparent;border:1.5px solid var(--border);border-radius:8px;color:var(--muted);font-family:'DM Sans',sans-serif;font-size:.76rem;padding:.38rem .85rem;cursor:pointer;transition:all .2s;display:inline-flex;align-items:center;gap:.32rem;}
  .done-btn:hover{border-color:var(--green);color:var(--green-light);}
  .q-card.done .done-btn,.t-card.done .done-btn{background:rgba(0,179,104,.1);border-color:var(--green-light);color:var(--green-light);}

  /* THEORY CARD */
  .t-card{background:var(--card);border:1.5px solid var(--border);border-radius:16px;overflow:hidden;transition:all .25s;animation:slideIn .3s ease both;}
  .t-card:hover{border-color:var(--gold);box-shadow:0 4px 18px rgba(244,169,0,.09);}
  .t-card.done{border-color:var(--green-light);opacity:.72;}
  .t-header{display:flex;align-items:flex-start;gap:.65rem;padding:.85rem 1.05rem;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent;}
  .t-badge{background:linear-gradient(135deg,var(--green-dark),#1a3828);border:1px solid var(--gold);color:var(--gold);font-family:'Syne',sans-serif;font-weight:800;font-size:.68rem;padding:.18rem .48rem;border-radius:7px;flex-shrink:0;margin-top:3px;white-space:nowrap;}
  .t-card.done .t-badge{background:var(--green);border-color:var(--green-light);color:#fff;}
  .t-question{flex:1;font-size:.86rem;line-height:1.5;color:var(--text);}
  .t-question strong{color:var(--gold);}
  .t-marks{font-size:.67rem;color:var(--marks);background:rgba(134,239,172,.1);border:1px solid rgba(134,239,172,.2);border-radius:5px;padding:.08rem .38rem;margin-left:.35rem;white-space:nowrap;}
  .t-details{display:none;padding:0 1.05rem 1.05rem;border-top:1px solid var(--border);}
  .t-card.open .t-details{display:block;}
  .t-section-label{font-family:'Syne',sans-serif;font-size:.62rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;margin-bottom:.25rem;display:flex;align-items:center;gap:.35rem;}
  .t-keypoints{background:rgba(78,205,196,.07);border:1px solid rgba(78,205,196,.18);border-radius:10px;padding:.7rem .85rem;margin-top:.85rem;font-size:.82rem;line-height:1.6;}
  .t-keypoints .t-section-label{color:var(--hint);}
  .t-keypoints ul{padding-left:1.05rem;margin-top:.28rem;}
  .t-keypoints ul li{margin-bottom:.2rem;}
  .t-model{background:rgba(0,179,104,.07);border:1px solid rgba(0,179,104,.2);border-radius:10px;padding:.7rem .85rem;margin-top:.5rem;font-size:.82rem;line-height:1.65;}
  .t-model .t-section-label{color:var(--answer);}
  .t-model .model-body{white-space:pre-line;}
  .t-model strong{color:var(--gold);}
  .t-examiner{background:rgba(249,168,212,.07);border:1px solid rgba(249,168,212,.18);border-radius:10px;padding:.7rem .85rem;margin-top:.5rem;font-size:.81rem;line-height:1.55;}
  .t-examiner .t-section-label{color:var(--examiner);}
  .t-mistake{background:rgba(255,107,107,.07);border:1px solid rgba(255,107,107,.17);border-radius:10px;padding:.7rem .85rem;margin-top:.5rem;font-size:.81rem;line-height:1.55;}
  .t-mistake .t-section-label{color:var(--trap);}

  /* SECTION DIVIDER */
  .section-divider{max-width:900px;margin:1.3rem auto .65rem;padding:0 1rem;display:flex;align-items:center;gap:.7rem;}
  .section-divider span{font-family:'Syne',sans-serif;font-size:.7rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);white-space:nowrap;}
  .section-divider::before,.section-divider::after{content:'';flex:1;height:1px;background:var(--border);}

  .empty{text-align:center;padding:2.5rem 1rem;color:var(--muted);}
  .empty h3{font-family:'Syne',sans-serif;color:var(--text);margin-bottom:.4rem;}
  .hidden{display:none!important;}
  footer{text-align:center;padding:1.2rem;color:var(--muted);font-size:.7rem;border-top:1px solid var(--border);}
  footer strong{color:var(--gold);}
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="brand">
      <div class="flag"><span class="g"></span><span class="w"></span><span class="g"></span></div>
      <div class="brand-text">
        <h1>Data Processing <span>SS3</span></h1>
        <div class="subtitle">WAEC Complete Study Guide</div>
      </div>
    </div>
    <div class="year-row">
      <span class="year-label">Year:</span>
      <button class="year-btn" onclick="switchYear('2024')">2024</button>
      <button class="year-btn active" onclick="switchYear('2025')">2025</button>
    </div>
    <div class="stats-bar">
      <div class="stat-pill"><span class="dot dot-green"></span><strong id="obj-total">40</strong> Objectives</div>
      <div class="stat-pill"><span class="dot dot-purple"></span><strong id="theory-total">0</strong> Theory Qs</div>
      <div class="stat-pill"><span class="dot dot-gold"></span><strong id="done-count">0</strong> Mastered</div>
    </div>
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('objectives')" id="tab-obj-btn">📝 Objectives (40)</button>
      <button class="tab-btn" onclick="switchTab('theory')" id="tab-th-btn">✍️ Theory</button>
    </div>
  </div>
</header>

<div class="controls">
  <div class="search-box">
    <span class="search-icon">🔍</span>
    <input type="text" id="search" placeholder="Search questions, topics, keywords…">
  </div>
  <div class="filters">
    <button class="filter-btn active" data-filter="all">All</button>
    <button class="filter-btn" data-filter="pending">Pending</button>
    <button class="filter-btn" data-filter="done">Mastered ✓</button>
  </div>
</div>

<div class="progress-section">
  <div class="progress-bar-wrap"><div class="progress-bar-fill" id="progress-fill" style="width:0%"></div></div>
  <div class="progress-label">Progress: <span id="progress-text">0 / 40</span> mastered</div>
</div>
<div class="result-count" id="result-count"></div>

<div id="tab-objectives"><div class="questions" id="obj-list"></div></div>
<div id="tab-theory" class="hidden"><div id="theory-container"></div></div>

<footer><strong>WAEC Data Processing</strong> · SS3 Complete Study Aid · Nigeria 🇳🇬</footer>

<script>
// ══════════════════════════════════════════
//  2024 OBJECTIVES DATA
// ══════════════════════════════════════════
const objectives2024 = [
  {num:1,text:"The Stepped Reckoner was developed by",options:["A. Gottfried Leibnitz","B. Herman Hollerith","C. John Von Neumann","D. William Schickard"],topic:"History of Computers",trap:"Students guess Babbage or Hollerith. Babbage built the Difference Engine/Analytical Engine. Hollerith invented the punch card tabulator. The Stepped Reckoner = Leibnitz.",hint:"Leibnitz built the Stepped Reckoner — an early mechanical calculator that could multiply and divide. The clue is in the name 'Reckoner' = calculating machine.",analogy:"Different inventors, different machines. Babbage = Difference Engine. Leibnitz = Stepped Reckoner. Don't mix them up — like confusing Dangote with Otedola!",answerLetter:"A",answerText:"Gottfried Leibnitz"},
  {num:2,text:"The binary number 100101₂ can be written in denary as",options:["A. 25","B. 37","C. 45","D. 211"],topic:"Number Base Conversion",trap:"Students only count two 1s and get a small number, or lose track of place values. The binary is 6 digits — positions are 32, 16, 8, 4, 2, 1.",hint:"100101₂ = 1×32 + 0×16 + 0×8 + 1×4 + 0×2 + 1×1 = 32 + 4 + 1 = 37",analogy:"Count which positions have a '1': the 32s place, the 4s place, and the 1s place. ₦32 + ₦4 + ₦1 = ₦37. Same logic!",answerLetter:"B",answerText:"37"},
  {num:3,text:"The first stage in computer data processing procedure is",options:["A. Collection of data","B. Communication of information","C. Conversion of data","D. Manipulation of data"],topic:"Data Processing Basics",trap:"'Manipulation' feels like it should come first — you're 'doing something' to data. But you must COLLECT data before you can manipulate it.",hint:"The data processing cycle always begins with collection. You cannot process what you have not collected.",analogy:"Before JAMB can mark your exam, they must first collect the answer booklets. No collection = no processing!",answerLetter:"A",answerText:"Collection of data"},
  {num:4,text:"One advantage of electronic data processing is that it",options:["A. Involves special skill","B. Deals only with simple data","C. Is completely error-free","D. Handles complex data"],topic:"Electronic Data Processing",trap:"'Completely error-free' is FALSE — garbage in, garbage out (GIGO). 'Deals only with simple data' is also FALSE — EDP handles complexity.",hint:"Electronic data processing can handle complex, cumbersome tasks that would be impossible to do manually. That's the key advantage.",analogy:"Calculating the payroll for 10,000 NNPC staff manually is nearly impossible. EDP handles that complex task in seconds!",answerLetter:"D",answerText:"Handles complex data"},
  {num:5,text:"The type of computer that has the ability of counting in discrete form is referred to as",options:["A. Analogue computer","B. Digital computer","C. Hybrid computer","D. Versatile computer"],topic:"Types of Computers",trap:"Analogue computers work with CONTINUOUS signals (like voltage). Hybrid = combination of both. Digital = discrete steps only.",hint:"Discrete = distinct, countable steps (0 and 1). Digital computers work entirely in binary = discrete form.",analogy:"An analogue clock hand moves CONTINUOUSLY. A digital clock jumps 3:05 → 3:06 in DISCRETE steps. That jumping = digital!",answerLetter:"B",answerText:"Digital computer"},
  {num:6,text:"One reason for using Computer Aided Design (CAD) in manufacturing is that",options:["A. It uses few system resources","B. Manufacturing time is reduced","C. Designers do not need training to use it","D. 3D designs are easily produced with it"],topic:"Applications of ICT / CAD",trap:"'Uses few system resources' is FALSE — CAD is resource-intensive. 'No training needed' is FALSE. Manufacturing time reduction is indirect.",hint:"CAD's primary advantage is the ability to create, rotate, and visualise complex 3D models and simulations on screen before building anything.",analogy:"An architect who used to draw blueprints by hand can now create a full 3D rotating building model on screen. Complex designs, made easy!",answerLetter:"D",answerText:"3D designs are easily produced with it"},
  {num:7,text:"Which one of the following statements is true about Voice Over IP (VoIP)?",options:["A. Converts voice and video data into a digital signal and transfers it over the Internet","B. Converts voice and video data into a digital signal and broadcasts it via a transmitter","C. Is a voice over communication system which is cyber-attack proof","D. Is a circuit-switched data communication system"],topic:"VoIP / Network Technology",trap:"VoIP is NOT circuit-switched (that's traditional telephone). It also doesn't BROADCAST via transmitter — it TRANSFERS over the Internet.",hint:"VoIP = Voice Over Internet Protocol. Digital signal + Internet transfer = WhatsApp calls, Zoom calls, Google Meet.",analogy:"Old phone calls used dedicated circuits (like a private road). VoIP breaks voice into digital packets and sends them over the shared Internet highway!",answerLetter:"A",answerText:"Converts voice and video data into a digital signal and transfers it over the Internet"},
  {num:8,text:"Which one of the following sets of devices can be used to store data during processing?",options:["A. Cache, RAM and Register","B. Cache, Register and ROM","C. Flash Drive, ROM and Hard Disk","D. RAM, Register and Zip Drive"],topic:"Primary Memory / Storage",trap:"ROM is read-only and not used for temporary storage during processing. Flash drive, Zip drive and Hard disk are secondary/permanent storage.",hint:"During processing, the CPU uses: Registers (internal CPU storage) + Cache (fast buffer) + RAM (main working memory). All three are primary storage.",analogy:"While cooking: what you're holding in your hands (Register) + what's on the counter next to you (Cache) + what's in the bowl in front of you (RAM). Not the fridge (hard disk)!",answerLetter:"A",answerText:"Cache, RAM and Register"},
  {num:9,text:"The process of inspecting, transforming and modeling data to get useful information is known as",options:["A. Collation","B. Interpretation","C. Execution","D. Analysis"],topic:"Data Processing Terms",trap:"Collation = arranging/ordering data. Interpretation = explaining meaning. Execution = running a program. Only analysis covers inspecting, transforming AND modelling.",hint:"Data Analysis = the full process of examining data through inspection, transformation, and modelling to discover useful patterns and information.",analogy:"After WAEC marks scripts, statisticians inspect the scores, transform them into grades, and model pass rates. That complete process = analysis!",answerLetter:"D",answerText:"Analysis"},
  {num:10,text:"One disadvantage of using computer for information processing is",options:["A. Need for staff retraining","B. Increased running cost in the long run","C. The increase in storage space","D. Redundancy of computers in the long run"],topic:"Disadvantages of Computers",trap:"Option A (staff retraining) is also a cost but it's a one-time transition cost. Option B is an ONGOING disadvantage — maintenance, power, upgrades never stop.",hint:"Computers require continuous maintenance, software updates, hardware upgrades and repairs — leading to increased running costs over time.",analogy:"A generator is cheaper to buy than to fuel and service for years. Same with computers — the ongoing electricity and maintenance bills add up!",answerLetter:"B",answerText:"Increased running cost in the long run"},
  {num:11,text:"The diagram in Figure 1 illustrates a process called",options:["A. Information processing","B. Information transmission","C. Modulation","D. Synchronization"],topic:"Communication Systems",trap:"Figure 1 shows a transmitter sending a signal to a receiver — this is a TRANSMISSION diagram, not a processing diagram. Don't confuse the two!",hint:"The diagram shows: Information Source → Transmitter → Channel → Receiver. That one-way signal flow = information transmission.",analogy:"When NTA broadcasts news from their studio to your TV at home, that's transmission — sending a signal from one point to another!",answerLetter:"B",answerText:"Information transmission"},
  {num:12,text:"The transmitter in communication is the component that",options:["A. Decodes sender's signal by interpretation","B. Encodes interpreted data by using machine language","C. Broadcasts synchronous signals","D. Launches signal into the air"],topic:"Communication Components",trap:"Decoding and interpreting are functions of the RECEIVER, not the transmitter. The transmitter's job is to SEND the signal out.",hint:"The transmitter takes the message and launches/sends the signal into the transmission medium (air, cable, fibre) so the receiver can pick it up.",analogy:"A radio station TRANSMITS by sending radio waves into the air. Your radio (receiver) picks them up. The station = transmitter that launches signal!",answerLetter:"D",answerText:"Launches signal into the air"},
  {num:13,text:"Which of the following resources is NOT usually shared in a network?",options:["A. VGA projector","B. Laserjet printer","C. Folder","D. File"],topic:"Network Resource Sharing",trap:"Folders, files, and printers ARE commonly shared over a network. VGA is a direct cable connection — it can't be networked.",hint:"Network-shared resources include printers, files, folders and internet connections. A VGA projector requires a physical cable directly from ONE computer.",analogy:"An office printer is shared over WiFi. Files and folders are shared on Google Drive. But your VGA cable to a projector plugs into ONE laptop only — not shared!",answerLetter:"A",answerText:"VGA projector"},
  {num:14,text:"Factors to be considered when creating a backup system in a computer network include",options:["A. Amount of RAM, amount of data and time of backup","B. Amount of RAM, type of data and frequency of backup","C. Media to use, amount of data and frequency of backup","D. Media to use, type of data and time of backup"],topic:"Backup Systems",trap:"Amount of RAM is irrelevant to backup planning — RAM is temporary working memory, not storage. 'Type of data' appears in B and D but the solution specifies C.",hint:"Backup planning covers: (1) what MEDIA to use, (2) how much DATA to back up, (3) how often = FREQUENCY. The media, data volume and frequency directly determine reliability.",analogy:"Plan to back up school work: use Google Drive (media) + back up all 500 files (amount of data) + every Friday (frequency). RAM doesn't matter here!",answerLetter:"C",answerText:"Media to use, amount of data and frequency of backup"},
  {num:15,text:"The URL www.exams.edu.ng represents the website of",options:["A. An examination body","B. A Nigerian-based learning institution","C. An educational institution in Niger","D. A research institution in Niger"],topic:"Internet / URLs",trap:"'.edu.ng' might suggest a school (learning institution) but 'exams' in the URL points specifically to an EXAMINATION body, not a teaching institution.",hint:"'exams' = examinations. '.edu.ng' = education, Nigeria. The combination points to a body that conducts exams in Nigeria — like WAEC or NECO.",analogy:"www.waec.org.ng is the website of an examination body. www.exams.edu.ng follows the same logic — it's for conducting exams, not teaching classes!",answerLetter:"A",answerText:"An examination body"},
  {num:16,text:"The Post Office Protocol (POP) is used to",options:["A. Interconnect devices on the Internet","B. Retrieve email from a mail server","C. Transfer file from a server to a client","D. Send email from one user to another"],topic:"Internet Protocols / Email",trap:"Sending email = SMTP. Transferring files = FTP. Interconnecting devices = routers/switches. POP is specifically for RETRIEVING (downloading) email.",hint:"POP = Post Office Protocol. You go to the post office to COLLECT your mail. POP downloads your email from the server to your device.",analogy:"POP is like picking up your letter from the post office. SMTP is like posting a letter. FTP is like sending a package. POP = collecting only!",answerLetter:"B",answerText:"Retrieve email from a mail server"},
  {num:17,text:"A user working on Windows 7 issued the command Ctrl + Alt + Del while typing a document. What interface is expected to be displayed?",options:["A. Restart Windows","B. Shut Down Windows","C. Windows Security","D. Windows Task Manager"],topic:"Operating System / Windows",trap:"In older Windows (XP), Ctrl+Alt+Del went straight to Task Manager. In Windows 7, it opens the Windows Security screen FIRST, giving you a menu of options.",hint:"Windows 7 Ctrl+Alt+Del → Windows Security screen → options: Lock, Switch User, Sign Out, Change Password, Task Manager.",analogy:"It's like a security checkpoint that gives you a MENU. You don't go straight to Task Manager — you first go through the security options screen!",answerLetter:"C",answerText:"Windows Security"},
  {num:18,text:"Header and Footer are added to a document in MS Word by just clicking on the",options:["A. Edit menu","B. Format menu","C. Insert menu","D. View menu"],topic:"MS Word Features",trap:"Students pick View (where Header/Footer was in older Word versions) or Format. In current MS Word versions, it's under the INSERT tab.",hint:"Insert tab → Header & Footer group. This is where you INSERT new elements into the document, including headers and footers.",analogy:"On your phone, you ADD a caption to a photo in the 'Insert' or 'Add' section — not in 'Format' or 'View.' Same logic in MS Word!",answerLetter:"C",answerText:"Insert menu"},
  {num:19,text:"A typist positioned the insertion point at the beginning of a line in a word processor and then pressed the Shift key and clicked at the opposite end of the text. What would be the result?",options:["A. The text will be copied into the clipboard","B. The text will be cut into the clipboard","C. The text will be deleted from storage","D. The text will be highlighted on the screen"],topic:"MS Word / Text Selection",trap:"Shift+click SELECTS text — it doesn't copy, cut or delete. Copying requires Ctrl+C AFTER selection. The immediate result is just highlighting.",hint:"Shift + Click = select everything from cursor position to where you click. The selected text becomes highlighted (blue). Nothing else happens yet.",analogy:"Using a highlighter pen on paper — you're marking text in yellow. It's not cut out, not copied, just HIGHLIGHTED/SELECTED. Same effect!",answerLetter:"D",answerText:"The text will be highlighted on the screen"},
  {num:20,text:"The Microsoft Excel menu bar icon shown in Figure 2 is used to",options:["A. Automatically add top selected values","B. Create label that spans multiple columns","C. Spot trends and patterns in user's data using bars, columns and icons","D. Organize data for easy analysis"],topic:"MS Excel Features",trap:"Figure 2 shows the sort and filter icon (funnel/A-Z). Students confuse it with AutoSum (Σ) or merge cells. Look at the icon shape carefully.",hint:"The funnel icon (or A-Z icon) = Sort and Filter. It organizes and filters data to make analysis easier.",analogy:"Like sorting students by score from highest to lowest — that organization helps you find patterns quickly. The sort/filter icon does exactly this!",answerLetter:"D",answerText:"Organize data for easy analysis"},
  {num:21,text:"To add a new column to the right of the IGR column on the interface in Figure 3, the user would",options:["A. Right-click on cell C1 and then click on insert","B. Right-click on cell D1 and then click on insert","C. Right-click on column C and then click on insert","D. Right-click on column D and then click on insert"],topic:"MS Excel Column Operations",trap:"Insert always creates a new column to the LEFT of where you right-click. So to add a column to the RIGHT of IGR (column C), you must right-click column D.",hint:"New column inserts to the LEFT of the selected column. IGR is in column C. Right-click column D → insert pushes D right and places new column between C and D.",analogy:"If you're 3rd in a queue and want someone to stand after you (to your right), they stand at position 4. Tell person at position 4 (column D) to move — then insert!",answerLetter:"D",answerText:"Right-click on column D and then click on insert"},
  {num:22,text:"The function of the foreign key in a database is to",options:["A. Uniquely identify tuples in a table","B. Provide a link between data in two tables","C. Uniquely identify an entity occurrence","D. Uniquely identify each record in a table"],topic:"Database Relationships",trap:"Options A, C, and D all describe PRIMARY key functions — uniquely identifying records/tuples. The foreign key's job is to LINK tables, not identify records.",hint:"Foreign key = a field in one table that references the primary key in another table. It creates the RELATIONSHIP (link) between two tables.",analogy:"Your student ID appears in both the 'Students' table and the 'Exam Results' table. In the Exam Results table, it's a foreign key — it links your result to your student record!",answerLetter:"B",answerText:"Provide a link between data in two tables"},
  {num:23,text:"How many primary keys exist in Figure 4?",options:["A. 3","B. 4","C. 5","D. 12"],topic:"Database / Primary Keys",trap:"Students count ALL fields in Figure 4 (which has many fields) and get a large number. Only count the fields specifically marked as primary keys.",hint:"Figure 4 shows 3 tables: Customers (CustomerId), Orders (OrderId) and Products (ProductId). Each table has ONE primary key = 3 total.",analogy:"Three classrooms, each with one register book. The admission number in each register = one primary key per table. 3 tables = 3 primary keys!",answerLetter:"A",answerText:"3"},
  {num:24,text:"Which of the following lists contains the primary keys in Figure 4?",options:["A. Customers, Orders and Products","B. CustomerId, OrderId and ProductId","C. CustomerId, FirstName, LastName and DateCreated","D. Customers, DateCreated, FirstName, LastName and DateCreated"],topic:"Database Design",trap:"Option A lists the TABLE NAMES, not the key FIELDS. Option C includes non-key fields (FirstName, LastName, DateCreated) that are not primary keys.",hint:"Primary keys are the unique ID fields in each table: CustomerId (in Customers), OrderId (in Orders), ProductId (in Products).",analogy:"In a school database, the primary keys would be AdmissionNo (not StudentName or DateOfBirth). The ID field, not the name fields, is the key!",answerLetter:"B",answerText:"CustomerId, OrderId and ProductId"},
  {num:25,text:"Web design packages include the following except",options:["A. Macromedia Dreamweaver","B. iWeb","C. Front Page","D. Adobe PageMaker"],topic:"Application Software / Web Design",trap:"Macromedia Dreamweaver, iWeb, and Adobe PageMaker are all web design tools. 'Front Page' in this context refers to the front/home page of a website — not a software package.",hint:"The WAEC answer treats 'Front Page' as the front/landing page of a website, not a software application. The other three ARE web design packages.",analogy:"'Front page' is like saying 'Chapter 1' of a book — it describes a page of a website, not the tool used to build it. The others (Dreamweaver, iWeb, PageMaker) are actual software!",answerLetter:"C",answerText:"Front Page"},
  {num:26,text:"The part labelled IV in Figure 5 (toolbox) is used to",options:["A. Shape objects","B. Select and transform objects","C. Draw lines and curves","D. Create texts"],topic:"CorelDraw / Graphics Software",trap:"Students pick B (select and transform) thinking IV is the Pick/Selection tool. But the curve tool (used to draw lines and curves) is labelled IV here.",hint:"Part IV = the Curve Tool in CorelDraw. It draws smooth curves, lines and shapes freehand.",analogy:"Like using a pen to draw a curved road on a map. The curve tool lets you draw flowing lines and curves — not just straight ones!",answerLetter:"C",answerText:"Draw lines and curves"},
  {num:27,text:"One precautionary measure taken when cleaning a monitor is",options:["A. Covering the monitor with antiglare","B. Cleaning the monitor with alcohol","C. Unplugging the power supply cable","D. Using a vacuum cleaner to dust the monitor casing"],topic:"Computer Maintenance / Safety",trap:"Alcohol can damage screen coatings. Vacuum cleaners can create static. Antiglare covers are used during USE, not cleaning. Safety first = cut the power!",hint:"For ANY electronic device — always UNPLUG before cleaning. This prevents electric shock and avoids short circuits from cleaning fluids.",analogy:"Before you wipe your phone screen with a damp cloth, you probably lock it or turn it off. For a monitor — always unplug it first!",answerLetter:"C",answerText:"Unplugging the power supply cable"},
  {num:28,text:"Which one of the following practices is considered ethical?",options:["A. Gaining access to school database to change one's grades","B. Gaining access into government database to alter personal details","C. Logging into a friend's social media account to read inbox messages","D. Signing into school e-library to read e-books"],topic:"Computer Ethics",trap:"Options A, B and C all involve UNAUTHORIZED access — to change grades, alter records, or read private messages. All are unethical. Only D is legitimate use.",hint:"Ethical = acting with permission and good intent. Signing into the school e-library with your own account to read books = authorized, legitimate use.",analogy:"Borrowing a library book = ethical. Breaking into the library at night to steal books = not ethical. Option D is the authorized, proper use!",answerLetter:"D",answerText:"Signing into school e-library to read e-books"},
  {num:29,text:"Proper network implementation and good ICT policies are types of",options:["A. Adaptive measures","B. Corrective measures","C. Perfective measures","D. Preventive measures"],topic:"ICT Maintenance Types",trap:"Corrective = fixing after a problem. Adaptive = modifying for new environment. Perfective = improving performance. Preventive = stopping problems BEFORE they occur.",hint:"Proper network setup and good ICT policies aim to PREVENT security incidents and problems from happening in the first place.",analogy:"Installing burglar-proof windows and CCTV BEFORE a robbery happens = preventive. Fixing the broken window AFTER the robbery = corrective!",answerLetter:"D",answerText:"Preventive measures"},
  {num:30,text:"Preventive maintenance measures in the computer room include the following options except",options:["A. Good ventilation","B. Proper illumination","C. The use of rugs","D. The use of tiles"],topic:"Computer Room Maintenance",trap:"Students think rugs are fine for comfort. Rugs generate static electricity (which damages components), trap moisture and cause poor heat dissipation.",hint:"Rugs in a computer room = bad. They produce static electricity, trap dust and moisture. Tiles are acceptable flooring. The exception is rugs.",analogy:"Static electricity from rugs can ZAP sensitive computer chips like a miniature lightning bolt. Hospitals ban rugs in operating theatres for similar reasons — safety!",answerLetter:"C",answerText:"The use of rugs"},
  {num:31,text:"Measures taken to avoid eye strain include the following except",options:["A. Adjusting the brightness of the monitor","B. Adjusting the height of the screen","C. Blinking of eyes often","D. Relaxing the body regularly"],topic:"Ergonomics / Eye Care",trap:"Options A, B, C are all genuine eye strain prevention measures. Option D (relaxing the body) is good for general health but is NOT specifically a measure for eye strain.",hint:"Eye strain prevention = what you do FOR YOUR EYES: adjust brightness, position screen at eye level, blink regularly, take 20-20-20 breaks. Body relaxation is general wellness, not eye-specific.",analogy:"To avoid toothache: brush teeth, use fluoride toothpaste, visit dentist. 'Exercise regularly' is good health advice but NOT a toothache prevention measure. Same logic here!",answerLetter:"D",answerText:"Relaxing the body regularly"},
  {num:32,text:"A database administrator is responsible for the following tasks except",options:["A. Controlling and monitoring user access to the database","B. Enrolling users and maintaining system security","C. Maintaining archived data","D. Maintaining connection between local network and the Internet"],topic:"Database Administration",trap:"Options A, B, C are all DBA duties. Maintaining the network connection between LAN and Internet = Network Administrator's job, not DBA.",hint:"DBA = manages the DATABASE: users, security, backups, archived data. Network connections between LAN and Internet = Network Admin's responsibility.",analogy:"A bank manager handles who can access the vault (DBA). But fixing the bank's internet connection? That's the IT/network team's job!",answerLetter:"D",answerText:"Maintaining connection between local network and the Internet"},
  {num:33,text:"A computer virus replicates itself into other programs or certain areas on the disk during the",options:["A. Dormant phase","B. Execution phase","C. Propagation phase","D. Trigger phase"],topic:"Computer Viruses / Phases",trap:"Dormant = virus is hiding/waiting. Execution = virus carries out its damage. Trigger = the event that wakes the virus. PROPAGATION = virus COPIES itself.",hint:"Propagation means SPREADING/REPLICATING. The virus copies itself into other files and programs during this phase.",analogy:"A dormant thief hides in the house. The trigger is the alarm switching off. PROPAGATION is when the thief calls his friends to join — copies of the thief appear!",answerLetter:"C",answerText:"Propagation phase"},
  {num:34,text:"A malware that copies and replicates itself using computer network and security flaws is",options:["A. Rootkit virus","B. Spyware","C. Trojan horse","D. Worm"],topic:"Types of Malware",trap:"Trojan horse disguises itself as legitimate software but does NOT self-replicate. Spyware monitors you silently. Rootkit hides in the system. Only WORM self-replicates via network.",hint:"A WORM spreads by copying itself across a network using security vulnerabilities. No human action needed — it travels and replicates automatically.",analogy:"A worm in an apple tunnels through the whole fruit on its own. A computer worm tunnels through a network, copying itself from one computer to the next automatically!",answerLetter:"D",answerText:"Worm"},
  {num:35,text:"The entities in Figure 6 are named",options:["A. RegNo, Name and Age","B. Musa, Uche and Bayo","C. Student and Subject","D. Maths, Eng and DP"],topic:"Database Entities",trap:"Students pick A (field names) or B (data values/records). Entities are the TABLES/OBJECTS being represented, not the field names or the actual data.",hint:"In a database, an ENTITY is a real-world object or concept represented by a table. Figure 6 shows two related tables: Student and Subject.",analogy:"In a school database, 'Student' and 'Subject' are entities (things we store data ABOUT). 'Musa' and 'Mathematics' are just DATA stored inside those entities.",answerLetter:"C",answerText:"Student and Subject"},
  {num:36,text:"Which one of the following statements is true about database tables?",options:["A. All the tables in a database have a common name","B. A table may contain repeating groups","C. Entries in a column are from different domains based on datatype","D. There are no duplicate rows in a table"],topic:"Database Tables",trap:"Option A is clearly false — tables have different names. Option B contradicts normalisation rules (repeating groups violate 1NF). Option D sounds right but C is the WAEC answer.",hint:"According to the WAEC solution, option C is correct: entries in different columns of a table come from different domains based on their respective data types.",analogy:"In a student table: the 'Name' column has text-domain values, the 'Age' column has numeric-domain values. Different columns = different data types/domains!",answerLetter:"C",answerText:"Entries in a column are from different domains based on datatype"},
  {num:37,text:"The major difference between serial and sequential files is that sequential files are",options:["A. Given a key","B. Sorted in a particular order","C. Stored as they come","D. Recorded in any storage medium"],topic:"File Organisation",trap:"Option C (stored as they come) describes SERIAL files — no order. Sequential files are stored AND sorted. The key difference is the SORTING.",hint:"Serial = records stored in the order they arrive (no sorting). Sequential = records stored and SORTED in a particular order (usually by key).",analogy:"Serial = throwing clothes randomly into a wardrobe. Sequential = hanging them sorted by colour or type. Both are stored, but sequential is ORDERED!",answerLetter:"B",answerText:"Sorted in a particular order"},
  {num:38,text:"Which one of the following pairs contains computer file classification?",options:["A. Master file and Serial file","B. Random file and Master file","C. Reference file and Random file","D. Transaction file and Master file"],topic:"File Classification",trap:"The key distinction is between file TYPES by PURPOSE (Master vs Transaction) versus file ACCESS methods (Serial, Random, Sequential). The correct classification PAIR is by purpose.",hint:"Master file (permanent, main records) and Transaction file (temporary, used to update master) = a classic complementary pair of file types by purpose.",analogy:"Your school's permanent student record = Master file. The daily attendance sheet used to update it = Transaction file. They work together as a pair!",answerLetter:"D",answerText:"Transaction file and Master file"},
  {num:39,text:"Which of the following statements support the goals of data backup? I. Need for duplication  II. Need for future reference  III. Protection against data loss",options:["A. I and II only","B. I and III only","C. II and III only","D. I, II and III"],topic:"Data Backup",trap:"Statement I (need for duplication) sounds like it supports backup. But duplication is a MEANS to achieve backup, not a GOAL of backup. The goals are: future reference and data loss protection.",hint:"Data backup goals = (II) preserving data for future reference + (III) protecting against data loss. Duplication is HOW you back up, not WHY.",analogy:"WHY do you photocopy your WAEC result? To have it in future (II) and in case the original gets lost (III). The act of photocopying = duplication (I) = just the method!",answerLetter:"C",answerText:"II and III only"},
  {num:40,text:"Which of the following characteristics is associated with the architecture of parallel database?",options:["A. Communication cost and problems cannot be ignored","B. Machines can be far from each other","C. Machines are physically close to each other","D. It is usually associated with shared-nothing architecture"],topic:"Parallel Databases",trap:"Options A, B, C may describe some aspects but the KEY identifying characteristic of parallel database architecture is the shared-nothing model.",hint:"Parallel databases use the Shared-Nothing Architecture — each node/machine has its own CPU, memory and disk. No sharing between nodes.",analogy:"Each branch office manages its own computer, files and staff independently — they don't share servers. That independence = shared-nothing architecture!",answerLetter:"D",answerText:"It is usually associated with shared-nothing architecture"},

const objectives2025 = [
  {num:1,text:"The <em>Difference Engine</em> was developed by?",topic:"History of Computers",trap:"Students confuse Blaise Pascal (invented the Pascaline calculator) with Charles Babbage. Both are 'fathers' of something — but different things.",hint:"'Difference' → think Babbage. Pascal made a simple calculator; Babbage made the complex engine.",analogy:"It's like confusing Dangote (built refineries) with Otedola (fuel/oil business). Both are big names, but different inventions!",answerLetter:"B",answerText:"Charles Babbage"},
  {num:2,text:"Convert A0B₁₆ to binary",topic:"Number Base Conversion",trap:"Students try hex→decimal→binary (long route) and make errors. Also mixing up A=10, B=11.",hint:"Convert each hex digit directly to 4-bit binary: A=1010, 0=0000, B=1011 → 101000001011",analogy:"Translating Yoruba → Igbo via English wastes time. Skip the middle man — translate each word directly!",answerLetter:"C",answerText:"101000001011₂"},
  {num:3,text:"Audio data are produced from?",topic:"Types of Data / Multimedia",trap:"Students pick 'graphics' thinking audio and visuals go together, or 'pictures' because phones produce both.",hint:"Audio = Sound. The question tells you — audio is what you hear.",analogy:"When you record a voice note on WhatsApp, what comes out? Sound! Not a picture.",answerLetter:"D",answerText:"Sounds"},
  {num:4,text:"Which variable is an example of numeric data? A. 568  B. B2  C. #10.00  D. Twenty-five",topic:"Data Types",trap:"Students pick '#10.00' thinking money is a number. The # symbol makes it alphanumeric. 'Twenty-five' is a word, not a digit.",hint:"Numeric data = pure digits only, usable in calculations. No symbols, no letters.",analogy:"Your WAEC score (568) can be added up. But 'B2' (like a seat number on a bus) cannot be calculated.",answerLetter:"A",answerText:"568"},
  {num:5,text:"The generation of computers in which the transistor was FIRST introduced is?",topic:"Generations of Computers",trap:"Students say 'third generation' forgetting transistors came in 2nd gen. Others confuse with ICs (3rd gen).",hint:"1st Gen=Vacuum tubes, 2nd Gen=Transistors, 3rd Gen=ICs, 4th Gen=Microprocessors.",analogy:"Think Nokia 3310 (2nd gen phones) — they first introduced keypads. Later phones improved it, but Nokia started it.",answerLetter:"C",answerText:"Second Generation"},
  {num:6,text:"One application of ICT in medicine is?",topic:"Applications of ICT",trap:"'Computer Aided Learning' sounds medical but it's for education. 'Computer Aided Manufacturing' is for factories.",hint:"CAT scan (Computerized Axial Tomography) — body scan using computers and X-rays, used in hospitals.",analogy:"When someone goes to LUTH or UCH for a 'body scan', that machine is a CT/CAT scan — pure ICT in medicine.",answerLetter:"C",answerText:"Computerized Axial Tomography"},
  {num:7,text:"Which reason justifies the prevalence of Personal Digital Assistance (PDA) devices?",topic:"Personal Digital Assistants",trap:"Option A says 'light weight AND very expensive' — being expensive doesn't make something prevalent (common)!",hint:"'Prevalence' means widespread use. Portability and usefulness everywhere = widespread adoption.",analogy:"Why does every SS3 student have a phone? Because you can use it anywhere — on the bus, at home, in school. Portability!",answerLetter:"B",answerText:"Very portable and can be used everywhere"},
  {num:8,text:"Which action is achieved by right-clicking a computer mouse?",topic:"Computer Mouse Operations",trap:"Students say 'closing windows' (that's the X button) or 'minimizing' (that's left-clicking the minimize button).",hint:"Right-click = context menu. It shows options based on what you clicked.",analogy:"Like pressing 'options' on your phone when you hold down an app icon — it shows what you can DO with it. Contextual menu!",answerLetter:"D",answerText:"Opening of contextual menus"},
  {num:9,text:"The manipulation of digitized information by computer is known as?",topic:"Information Processing",trap:"'Data collation' (arranging data) and 'data mining' (finding patterns) sound similar but are different from the overall process.",hint:"The WHOLE process of handling digital data by computer = Information Processing.",analogy:"When JAMB collects your answers, arranges them, scores them and produces results — that entire activity is information processing.",answerLetter:"D",answerText:"Information Processing"},
  {num:10,text:"Which statement does NOT explain information processing?",topic:"Information Processing",trap:"All options sound plausible. The key is 'saving' alone is not processing — no transformation happens.",hint:"Processing involves TRANSFORMATION of data. Saving is just storage.",analogy:"Writing your name in a notebook is just saving (storage). But calculating your average from test marks is processing.",answerLetter:"A",answerText:"Act of saving a document"},
  {num:11,text:"The part labelled X in Figure 1 (Information Cycle) is?",topic:"Information Cycle",trap:"Students confuse 'feedback' with 'output.' Output is the result; feedback is the return loop that improves the process.",hint:"X is the arrow going BACK to the input stage. What goes back? Feedback.",analogy:"Your teacher marks your test (output), then tells you what you got wrong so you can improve (feedback). That return = feedback!",answerLetter:"C",answerText:"Feedback"},
  {num:12,text:"Which gadget transmits BOTH visual and audio information?",topic:"Communication Devices",trap:"Facsimile (fax) = visual only. Radio = audio only. Walkie-Talkie = audio only.",hint:"You need BOTH video + audio. Only one device does both.",analogy:"When you watch NTA News or Channels TV, you see the presenter AND hear their voice. Television = both!",answerLetter:"C",answerText:"Television"},
  {num:13,text:"The underlying technology in the network connection in Figure 2 is?",topic:"Network Technologies",trap:"Students see 'wireless' and pick 'Ethernet' — but Ethernet uses cables! 'Laser jet' is a printer technology.",hint:"Figure 2 shows devices connected wirelessly at short range. Short-range wireless = Bluetooth.",analogy:"When you share files using Xender or Bluetooth between nearby phones — no cable, short range. That's Figure 2!",answerLetter:"A",answerText:"Bluetooth"},
  {num:14,text:"One limitation of the network type in Figure 2 (Bluetooth) is?",topic:"Network Limitations",trap:"Students pick 'cost of maintenance is high' — Bluetooth is cheap! 'Weather affects data sharing' = satellite networks.",hint:"Bluetooth's biggest weakness = short range (~10 metres). Walk too far, connection drops.",analogy:"You've tried to Bluetooth something to a friend but walked to another room and it disconnected. Distance!",answerLetter:"B",answerText:"Distance covered is short"},
  {num:15,text:"The interface in Figure 3 is used for?",topic:"Application Software / Email",trap:"'Creating new sites' is web design. 'Creating portable documents' is PDF tools. 'Sending SMS' is for phones.",hint:"Figure 3 shows Inbox, Sent Items, Drafts, Junk Email — classic email folders!",analogy:"The interface looks exactly like your Gmail or Yahoo Mail — where you read and send emails.",answerLetter:"C",answerText:"Sending and receiving e-mails"},
  {num:16,text:"The part labelled III in Figure 3 (email interface) is used for?",topic:"Email Client Features",trap:"Students confuse 'Drafts' (unsent) with 'Sent Items' (already sent) and 'Deleted Items' (removed emails).",hint:"Count the folders: I=Other, II=Sent Items, III=Deleted Items, IV=Archive.",analogy:"On your Gmail, when you delete an email, it goes to Trash — same as Deleted Items. It doesn't disappear immediately.",answerLetter:"A",answerText:"Keeping/storing deleted emails"},
  {num:17,text:"What happens when Shift is pressed while deleting a file in Windows?",topic:"OS / File Management",trap:"Students think it goes to Recycle Bin like normal deletion. The Shift key BYPASSES the Recycle Bin entirely.",hint:"Normal Delete → Recycle Bin. Shift + Delete → Gone forever.",analogy:"Normally throwing rubbish in a bin — you can retrieve it. But Shift+Delete is like burning the rubbish immediately. No going back!",answerLetter:"B",answerText:"Permanently deleted from the computer"},
  {num:18,text:"Correct order of steps to change to landscape orientation in MS Word (Figure 4)?",topic:"MS Word / Page Setup",trap:"Students mix up the order of clicking labelled parts in Figure 4.",hint:"Landscape: Click Landscape (I) → Select scope 'Apply to' (IV) → Click OK (V). = I, IV, V.",analogy:"Ordering food: Choose your meal (I) → Choose portion/who it's for (IV) → Pay and confirm (V).",answerLetter:"B",answerText:"I, IV and V"},
  {num:19,text:"Correct order to REVERT to portrait orientation after typing in landscape (Figure 4)?",topic:"MS Word / Page Setup",trap:"Students pick the same answer as Q18 not realizing the 'Apply to' option changes when reverting.",hint:"Portrait revert = I, III, V. Different 'Apply to' selection (III instead of IV).",analogy:"Same restaurant — changing your order back. Similar steps but a different portion option (III not IV).",answerLetter:"A",answerText:"I, III and V"},
  {num:20,text:"What happens when a user clicks the MS Excel clipboard icon shown in Figure 5?",topic:"MS Excel / Clipboard",trap:"Students confuse 'Merge cells' (spans columns) with the Copy clipboard icon.",hint:"Clipboard icon in Excel = Copy. Places selected content onto the clipboard for pasting.",analogy:"It's like pressing Ctrl+C on your keyboard. The copy sits on your 'clipboard' waiting to be pasted.",answerLetter:"A",answerText:"A copy of the selection is put on the clipboard"},
  {num:21,text:"To add a new row ABOVE EKITI in Figure 6 (Excel), the user right-clicks on?",topic:"MS Excel / Row Operations",trap:"Students right-click row 5 thinking 'EKITI is row 5.' But EKITI is in row 6. New row inserts ABOVE where you right-click.",hint:"New row inserts above whichever row you right-click. EKITI = row 6. Right-click row 6 → Insert.",analogy:"If you're at position 6 in a queue and someone joins in front of you, they take position 6 and push you to 7. Right-click YOUR position.",answerLetter:"D",answerText:"Row 6 and then click on insert"},
  {num:22,text:"Which is NOT considered when designing a database in MS Access?",topic:"Database Design",trap:"Students think 'how forms will be used' sounds important. But forms are an interface concern — not a core structure concern.",hint:"Database design focuses on tables, relationships, fields, keys, and purpose. Forms are designed AFTER.",analogy:"When WAEC designs an exam, they first decide subjects and marking — not yet how the answer sheet LOOKS. That comes later!",answerLetter:"A",answerText:"How forms will be used"},
  {num:23,text:"Tables in MS Access are created using the following methods EXCEPT?",topic:"Microsoft Access",trap:"'Table insertion' SOUNDS like a valid Access method. Students who don't use Access assume it exists.",hint:"Valid methods = Datasheet View, Design View, Table Wizard. 'Table insertion' does NOT exist in Access.",analogy:"You can write an assignment by hand, type it, or use a template. But 'assignment insertion' is not a method — it's made up!",answerLetter:"C",answerText:"Table insertion"},
  {num:24,text:"Keyboard shortcut for adding a new slide in PowerPoint?",topic:"MS PowerPoint Shortcuts",trap:"Students confuse Ctrl+H (Find & Replace) with Ctrl+M. Some guess Alt+M.",hint:"Ctrl + M = New slide in PowerPoint. M = 'More' slides!",analogy:"You want MORE slides in your presentation — press Ctrl + M. M for More!",answerLetter:"B",answerText:"Ctrl + M"},
  {num:25,text:"An example of web design software is?",topic:"Application Software",trap:"'CSS' is a style language NOT software. 'MS Outlook' is email. 'SPSS' is statistics.",hint:"MS Publisher can create web pages and HTML content — Microsoft's desktop publishing and basic web design tool.",analogy:"CSS is like grammar rules of English — not a textbook itself. MS Publisher is the actual textbook you use to design pages.",answerLetter:"C",answerText:"MS Publisher"},
  {num:26,text:"Part labelled VII in Figure 7 (CorelDraw Toolbox) is used to?",topic:"CorelDraw / Graphics",trap:"Students confuse the Shape Tool with the Selection tool. Selection tool selects; Shape Tool edits nodes/curves.",hint:"VII = Shape Tool in CorelDraw. It edits nodes and curves of a vector object.",analogy:"Selection tool = picking up a ball of clay. Shape Tool = pressing your fingers INTO it to mold and reshape it.",answerLetter:"A",answerText:"Shape objects"},
  {num:27,text:"Erratic movement of the mouse pointer is caused by?",topic:"Computer Maintenance / Hardware",trap:"Students pick 'hardware failure' thinking it's serious. Erratic movement is usually a simple, fixable cause.",hint:"Erratic = jumpy/inconsistent. Dirty mouse ball (old mice) or dirty optical sensor (modern mice).",analogy:"When your phone screen doesn't respond where you touch it, it's usually DIRTY. Clean it and it works. Same with a mouse!",answerLetter:"B",answerText:"Dirty mouse ball"},
  {num:28,text:"Suitable method of removing particles from the keyboard is?",topic:"Computer Maintenance",trap:"'Dripping wet cloth' can damage electronics. 'Iron brush' can break keys. 'Hot air' can melt components.",hint:"Compressed air safely blows dust out from between keys without touching or damaging them.",analogy:"It's like using your mouth to blow dirt off a book without touching it. Compressed air does the same, just stronger!",answerLetter:"C",answerText:"Using compressed air"},
  {num:29,text:"Which statement is true about preventing phishing?",topic:"Cybersecurity / Phishing",trap:"Students pick 'Ensure antivirus is updated regularly' — antivirus helps generally but doesn't specifically prevent phishing.",hint:"Phishing tricks you into clicking malicious links in emails. The direct prevention = don't click suspicious links.",analogy:"If a stranger hands you a sweet on the street, you don't eat it. Same way, don't click links from unknown emails!",answerLetter:"B",answerText:"Do not click on links in e-mails from unknown sources"},
  {num:30,text:"Preventive maintenance in the computer room includes the following EXCEPT?",topic:"Computer Maintenance",trap:"Students think rugs make a room comfortable and therefore belong in a computer room. Comfort ≠ safety for computers.",hint:"Rugs generate static electricity (harmful to components) and trap dust. They are a hazard, NOT a maintenance measure.",analogy:"Good room = good ventilation, no dust, proper lighting. But rugs everywhere trap dirt and cause electric shocks. Odd one out!",answerLetter:"D",answerText:"The use of rugs on the floor"},
  {num:31,text:"When cleaning the computer system, it is ADVISABLE to?",topic:"Computer Maintenance / Safety",trap:"Students pick 'restart the computer first' — the computer is still powered. Dangerous when cleaning!",hint:"Safety first! POWER OFF and disconnect from power source before cleaning. Avoids electric shock and short circuits.",analogy:"Before an electrician touches wires in your house, they switch off the main power first. Same logic — turn OFF and unplug!",answerLetter:"B",answerText:"Turn off the computer and disconnect from power source"},
  {num:32,text:"A system analyst is a professional who?",topic:"ICT Careers",trap:"Students confuse 'designs flowcharts' (a tool, not the main role) with the full job. Others think they write code like programmers.",hint:"A system analyst DESIGNS and IMPLEMENTS computer-based solutions — bridges business problems and technology.",analogy:"Like an architect — they don't lay bricks (programmer's job) but they design the plan AND oversee construction. That's a system analyst!",answerLetter:"B",answerText:"Designs and implements new computer-based solutions"},
  {num:33,text:"Which one of the following programs is NOT a type of virus?",topic:"Computer Viruses / Malware",trap:"Trojan horse sounds dangerous and 'virus-like' so students include it. But a Trojan does NOT self-replicate like a virus.",hint:"A virus SELF-REPLICATES. A Trojan horse does NOT replicate — it disguises itself to trick users.",analogy:"A real virus spreads person to person (like flu). A Trojan is like a fake doctor who enters your house pretending to help. He doesn't spread — he deceives!",answerLetter:"D",answerText:"Trojan horse"},
  {num:34,text:"The computer virus WAITS for a trigger during which phase?",topic:"Computer Viruses / Phases",trap:"Students confuse 'dormant phase' (waiting/hiding) with 'trigger phase' (when the event occurs). The virus WAITS during dormant.",hint:"Virus phases: Dormant (waiting) → Trigger (event occurs) → Execution (attack) → Propagation (spreads).",analogy:"It's like a thief who hides under the bed, waiting until everyone is asleep before striking. That hiding = Dormant phase!",answerLetter:"A",answerText:"Dormant phase"},
  {num:35,text:"The SQL constraint used to ensure accuracy and consistency of data in a relational database is?",topic:"Database / SQL Constraints",trap:"'Default constraint' sets a default value. 'Index constraint' improves search speed. 'Unique constraint' prevents duplicates.",hint:"Integrity constraint = rules that ensure data is accurate, consistent, and valid across the entire database.",analogy:"A school register rule: 'you cannot enter a student twice' and 'age must be a real number.' Those rules ensure accuracy and consistency.",answerLetter:"C",answerText:"Integrity constraint"},
  {num:36,text:"For a one-to-one relationship in a database, both fields should have?",topic:"Database Relationships / Keys",trap:"Students think only the primary key needs to be unique. For one-to-one, the FOREIGN key must ALSO be unique.",hint:"One-to-one = one record in Table A links to exactly ONE record in Table B. Both keys must be unique.",analogy:"One husband, one wife (legally). Both must be 'unique' — a husband can't marry two wives AND a wife can't have two husbands. Both unique!",answerLetter:"B",answerText:"Both primary and foreign key fields should have unique key index"},
  {num:37,text:"An advantage of MANUAL file over COMPUTER file is?",topic:"File Management",trap:"Students think manual files are more efficient or faster — they're NOT. Computers win on speed, efficiency and storage.",hint:"Manual files (paper) CANNOT get corrupted by viruses, software crashes, or accidental formatting.",analogy:"A printed WAEC result can't be hacked or wiped by a virus. But a digital one on a flash drive can be destroyed. Paper wins here!",answerLetter:"C",answerText:"Risk of corrupted data is much less"},
  {num:38,text:"A file changing to a shortcut icon in a removable device implies?",topic:"Computer Viruses / File Management",trap:"Students think the file is corrupt (damaged). But it's hidden — a shortcut virus placed a link in its location.",hint:"Shortcut virus hides your files and replaces them with shortcuts. The original still exists — it's just hidden.",analogy:"Going to collect your result but finding a NOTE saying 'go to principal's office.' Result isn't destroyed — it's redirected. Note = shortcut icon!",answerLetter:"D",answerText:"There is a link to the file"},
  {num:39,text:"Objectives of secure database design include the following EXCEPT?",topic:"Database Security",trap:"'Simplicity' sounds like a good principle. Simple systems are easier to manage — so students think it belongs.",hint:"Core security objectives = Secrecy, Integrity, Availability (CIA). Simplicity is NOT a security objective.",analogy:"Objectives of a good security guard: keep secrets, maintain discipline, always be available. 'Be simple/easy-going' is NOT one!",answerLetter:"A",answerText:"Simplicity"},
  {num:40,text:"Which is NOT an advantage of distributed database?",topic:"Distributed Databases",trap:"'Need for complex software' sounds like a technical feature. Students assume it's an advantage because distributed systems are 'advanced.'",hint:"Advantages = Better response, Lower communication cost, Improved reliability. Needing complex software is a DISADVANTAGE.",analogy:"Business branches in Lagos, Kano, Abuja, PH is great — faster service. But managing all four needs complex coordination. That's a disadvantage!",answerLetter:"D",answerText:"Need for complex software"}
];
